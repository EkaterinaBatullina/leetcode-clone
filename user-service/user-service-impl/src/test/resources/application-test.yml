spring:
    datasource:
        url: jdbc:tc:postgresql:16:///agona_db
        driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
        username: test
        password: test
        hikari:
            maximum-pool-size: 2
    rabbitmq:
        host: localhost
    liquibase:
        enabled: true
        change-log: classpath:/db/changelog/changelog-master.yml
    kafka:
        bootstrap-servers: localhost:9092
        client-id: test-client
        user-registered-topic: user-registered-event
        user-registered-token: user_registered

rsa:
    # Тестовая RSA-пара ключей для подписи и проверки JWT в интеграционных тестах.
    # Используются только для поднятия Spring context в тестах.
    private-key: 
    public-key: 

oauth2:
    client:
        my-app:
            # Тестовые учётные данные для BasicAuthFilter.
            client-id: my-client-id
            client-secret: my-client-secret