spring:
  main:
    allow-bean-definition-overriding: true

  kafka:
    type-mappings: "user-registered-event:com.technokratos.event.UserRegisteredEvent"

    properties:
      spring.json.value.default.type: com.technokratos.event.UserRegisteredEvent
      spring.json.trusted.packages: com.technokratos

    listener:
      auto-startup: true
      ack-mode: batch
    consumer:
      auto-offset-reset: earliest
      group-id: notification-service-test
      enable-auto-commit: true
    producer:
      client-id: notification-service-test-client
    topic:
      user-registered: user-registered-event

mail:
  username: test
  password: test

management:
  health:
    mail:
      enabled: false
